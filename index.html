<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="План дня">
  <title>План дня</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="settings-btn" id="settingsBtn" type="button" aria-label="Выбор темы">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/></svg>
  </button>
  <div class="theme-panel" id="themePanel" hidden>
    <button type="button" data-theme="base"><b>Классика</b><span>текущий дизайн</span></button>
    <button type="button" data-theme="minimal"><b>Минимализм</b><span>чистый список без рамок</span></button>
    <button type="button" data-theme="soft"><b>Soft UI</b><span>объёмные «тактильные» элементы</span></button>
    <button type="button" data-theme="cards"><b>Карточки</b><span>каждое дело — отдельная карточка</span></button>
  </div>

  <main class="app">
    <header class="header">
      <h1>План дня</h1>
      <p class="date" id="date"></p>
    </header>

    <form class="add-form" id="addForm" autocomplete="off">
      <input id="taskInput" type="text" placeholder="Что нужно сделать?" maxlength="200">
      <button type="submit" class="add-btn">Добавить</button>
    </form>

    <p class="form-hint">Свайп вправо по делу — перенести на завтра</p>

    <ul class="task-list" id="taskList"></ul>

    <section class="success-card" id="successCard" hidden>
      <div class="success-icon" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>
      </div>
      <h2>Молодец, так держать!</h2>
      <p class="success-sub">Хороший день!</p>

      <button class="done-toggle" id="doneToggle" type="button" aria-expanded="false">
        <span>Выполнено за сегодня · <b id="doneCount">0</b></span>
        <svg class="chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="done-wrap" id="doneWrap">
        <ul class="done-list" id="doneList"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
